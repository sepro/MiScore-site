<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages 404 to SPA redirect
    // This script takes the current 404 path and converts it to a hash-based route
    // that the SPA router can handle
    
    // Get the full current path
    var currentPath = window.location.pathname;
    var search = window.location.search;
    
    // Detect if we're in a subdirectory by checking for common GitHub Pages patterns
    // or if the URL contains a path that doesn't match our known routes
    var basePath = '';
    var routePath = currentPath;
    
    // Common GitHub Pages subdirectory patterns
    var repoPatterns = [
      /^\/([a-zA-Z0-9_-]+site)\/(.*)$/, // Matches /something-site/... or /somethingsite/...
      /^\/([a-zA-Z0-9_-]+)\/(.*)$/      // General repo pattern /repo-name/...
    ];
    
    for (var i = 0; i < repoPatterns.length; i++) {
      var match = currentPath.match(repoPatterns[i]);
      if (match && match[1]) {
        // Check if this looks like a known repository name pattern
        var possibleRepo = match[1].toLowerCase();
        if (possibleRepo.includes('miscore') || possibleRepo.includes('site') || possibleRepo.includes('-')) {
          basePath = '/' + match[1];
          routePath = '/' + (match[2] || '');
          break;
        }
      }
    }
    
    // Clean up the route path
    if (routePath === '/' || routePath === '') {
      // Home page redirect
      window.location.replace(
        window.location.protocol + '//' + 
        window.location.hostname + 
        (window.location.port ? ':' + window.location.port : '') + 
        basePath + 
        '/' + search
      );
    } else {
      // Convert route to hash-based routing
      // Remove leading slash from routePath for hash
      var hashPath = routePath.startsWith('/') ? routePath.slice(1) : routePath;
      
      window.location.replace(
        window.location.protocol + '//' + 
        window.location.hostname + 
        (window.location.port ? ':' + window.location.port : '') + 
        basePath + 
        '/#/' + 
        hashPath + 
        search
      );
    }
  </script>
</head>
<body>
  <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
    <h2>Redirecting...</h2>
    <p>If you are not redirected automatically, <a href="./">click here to go to the homepage</a>.</p>
  </div>
</body>
</html>
