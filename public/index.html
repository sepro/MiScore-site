<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset='utf-8'>

	<title>MiScore - Gaming Records</title>

	<link rel='icon' type='image/png' href='/MiScore-site/favicon.png'>
	<link rel='stylesheet' href='/MiScore-site/global.css'>
	<link rel='stylesheet' href='/MiScore-site/build/bundle.css'>

	<!-- GitHub Pages SPA redirect handler -->
	<script>
		// Handle redirects from 404.html for GitHub Pages SPA routing
		(function(l) {
			if (l.search[1] === '/' ) {
				var decoded = l.search.slice(1).split('&').map(function(s) { 
					return s.replace(/~and~/g, '&')
				}).join('?');
				window.history.replaceState(null, null,
					l.pathname.slice(0, -1) + decoded + l.hash
				);
			}
		}(window.location))
	</script>
	
	<script defer src='/MiScore-site/build/bundle.js'></script>
</head>
